<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频转透明GIF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .controls {
            display: none;
            margin-bottom: 20px;
        }

        .controls.active {
            display: block;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .range-value {
            display: inline-block;
            margin-left: 10px;
            color: #667eea;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .preview-area {
            display: none;
            margin-top: 30px;
        }

        .preview-area.active {
            display: block;
        }

        video {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .preview-gif {
            width: 100%;
            border-radius: 10px;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAGElEQVQYlWNgYGCQwoKxgqGgcJA5h3yFAAs8BRWVSwooAAAAAElFTkSuQmCC') repeat;
            padding: 20px;
        }

        .preview-gif img {
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }

        .progress {
            display: none;
            margin: 20px 0;
        }

        .progress.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .error.active {
            display: block;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 视频转透明GIF</h1>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📹</div>
            <div class="upload-text">点击或拖拽视频文件到此处</div>
            <div class="upload-text" style="font-size: 14px; color: #999;">支持 MP4, WebM, MOV 等格式</div>
            <input type="file" id="fileInput" accept="video/*">
        </div>

        <div class="error" id="error"></div>

        <div class="controls" id="controls">
            <div class="control-group">
                <label>背景颜色选择: <span class="range-value" id="colorValue">点击视频画面取色</span></label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button id="pickColorBtn" style="width: auto; padding: 10px 20px; margin: 0;">🎨 点击视频取色</button>
                    <div id="colorPreview" style="width: 60px; height: 40px; border: 2px solid #ddd; border-radius: 5px; background: #fff;"></div>
                </div>
                <small style="color: #999;">点击按钮后，再点击视频画面选择要去除的背景颜色</small>
            </div>

            <div class="control-group">
                <label>快速预设</label>
                <div style="display: flex; gap: 10px;">
                    <button id="presetHighQuality" style="width: auto; padding: 10px 20px; margin: 0; background: #10b981;">⚡ 无损高质量</button>
                    <button id="presetBalanced" style="width: auto; padding: 10px 20px; margin: 0; background: #3b82f6;">⚖️ 平衡模式</button>
                    <button id="presetSmallSize" style="width: auto; padding: 10px 20px; margin: 0; background: #f59e0b;">📦 小文件</button>
                </div>
            </div>

            <div class="control-group">
                <label>
                    背景颜色选择: <span class="range-value" id="colorValue">RGB(255, 255, 255)</span>
                </label>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <input type="color" id="colorPicker" value="#ffffff" style="width: 60px; height: 40px; border: 2px solid #ddd; border-radius: 5px; cursor: pointer;">
                    <div style="display: flex; gap: 5px; align-items: center;">
                        <span style="font-size: 12px; color: #666;">R:</span>
                        <input type="number" id="colorR" min="0" max="255" value="255" style="width: 60px; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                        <span style="font-size: 12px; color: #666;">G:</span>
                        <input type="number" id="colorG" min="0" max="255" value="255" style="width: 60px; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                        <span style="font-size: 12px; color: #666;">B:</span>
                        <input type="number" id="colorB" min="0" max="255" value="255" style="width: 60px; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <div id="colorPreview" style="width: 60px; height: 40px; border: 2px solid #ddd; border-radius: 5px; background: #fff;"></div>
                </div>
                <small style="color: #999;">使用拾色器选择颜色，或手动输入 RGB 值</small>
            </div>

            <div class="control-group">
                <label>
                    帧率（FPS）: <span class="range-value" id="fpsValue">30</span>
                </label>
                <input type="range" id="fps" min="5" max="60" value="30" step="1">
            </div>

            <div class="control-group">
                <label>
                    GIF 质量（1-30，数值越小质量越高）: <span class="range-value" id="qualityValue">1</span>
                </label>
                <input type="range" id="quality" min="1" max="30" value="1" step="1">
                <small style="color: #999;">质量1为最高质量（文件较大），质量30为最低质量（文件较小）</small>
            </div>

            <div class="control-group">
                <label>
                    缩放比例: <span class="range-value" id="scaleValue">1</span>
                </label>
                <input type="range" id="scale" min="0.1" max="1" value="1" step="0.1">
                <small style="color: #999;">1.0 为原始尺寸（无损），数值越小文件越小</small>
            </div>

            <div class="control-group">
                <label>
                    背景移除阈值（0-255）: <span class="range-value" id="thresholdValue">30</span>
                </label>
                <input type="range" id="threshold" min="0" max="255" value="30" step="5">
                <small style="color: #999;">调整此值可以控制透明度敏感度</small>
            </div>

            <button id="convertBtn">🎨 开始转换</button>
            <button id="resetBtn" style="background: #6c757d;">🔄 重新上传</button>
        </div>

        <div class="preview-area" id="previewArea">
            <h3>视频预览</h3>
            <video id="videoPreview" controls></video>
            <canvas id="pickCanvas" style="display: none;"></canvas>
        </div>

        <div class="progress" id="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>

        <div class="preview-area" id="gifPreview">
            <h3>GIF 预览（透明背景）</h3>
            <div class="preview-gif">
                <img id="gifImage" alt="Generated GIF">
            </div>
            <button id="downloadBtn">📥 下载 GIF</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script src="gif.js"></script>
    <script src="app.js"></script>
</body>
</html>
