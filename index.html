<!doctype html>
<!-- A responsive GIF gallery: preview in place, open original, download original.
     Only visible GIFs are decoded; lightweight PNG covers keep scrolling responsive.
     No device mockups, wallpaper settings, or conversion scripts. -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111310">
<meta name="description" content="预览和下载 assets/view 目录中的 GIF 动图，支持手机和电脑。">
<title>GIF 图库 · 预览与下载</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23c9f5a6'/%3E%3Cpath d='M12 13h24v22H12zM12 29l8-8 6 6 4-4 6 6' fill='none' stroke='%23111310' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { width: 100%; min-height: 100%; overflow-x: hidden; }
  :root { color-scheme: dark; --background: #111310; --surface: #1a1d18; --border: #30362d; --text: #eff1eb; --muted: #a0a79a; --accent: #c9f5a6; }
  body { background: var(--background); color: var(--text); font: 14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
  .container { width: 100%; max-width: 1280px; margin-inline: auto; padding-inline: 32px; }
  .page-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-block: 32px 24px; }
  h1 { font-size: clamp(1.375rem,1.1rem + .8vw,1.75rem); font-weight: 600; letter-spacing: -.035em; line-height: 1.3; }
  .intro { margin-top: 8px; color: var(--muted); font-size: .8125rem; }
  .count { flex-shrink: 0; color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; }
  .gallery { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 24px; padding-bottom: 32px; }
  .gif-card { min-width: 0; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .preview { position: relative; display: block; aspect-ratio: 4/3; background: #080a08; overflow: hidden; }
  .preview img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; }
  .gif-image { z-index: 1; }
  .format { position: absolute; z-index: 2; left: 12px; top: 12px; padding: 2px 6px; border: 1px solid #ffffff20; border-radius: 4px; color: #fff; background: #111b; font: .625rem/1.6 ui-monospace,monospace; pointer-events: none; }
  .load-note { position: absolute; z-index: 2; bottom: 12px; left: 12px; right: 12px; width: fit-content; max-width: calc(100% - 24px); color: #fff; background: #111d; padding: 4px 8px; border-radius: 4px; font-size: .6875rem; pointer-events: none; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; }
  .file-info { min-width: 0; }
  .filename { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .8125rem; font-weight: 500; }
  .file-meta { color: var(--muted); font-size: .6875rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .download { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding-inline: 12px; flex-shrink: 0; border: 1px solid var(--border); border-radius: 8px; color: var(--accent); font-size: .75rem; transition: background 150ms,border-color 150ms; }
  .download:hover { background: #283320; border-color: #526746; }
  .download svg { width: 16px; height: 16px; }
  .empty { grid-column: 1/-1; padding: 64px 20px; text-align: center; color: var(--muted); }
  .empty a { color: var(--accent); }
  @media (max-width: 1000px) { .gallery { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 20px; } }
  @media (max-width: 580px) {
    .container { padding-inline: 16px; }
    .page-header { padding-block: 24px 20px; gap: 12px; }
    .intro { font-size: .75rem; max-width: 28ch; }
    .gallery { grid-template-columns: minmax(0,1fr); gap: 20px; }
    .card-footer { padding: 10px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>
</head>
<body>
<main class="container">
  <header class="page-header"><div><h1>GIF 图库</h1><p class="intro">点图预览，下载原始 GIF。</p></div><span class="count" id="count" role="status">读取中…</span></header>
  <section class="gallery" id="gallery" aria-label="GIF 图片列表" aria-busy="true"><p class="empty">正在读取动图…</p></section>
  <noscript><p class="empty">请启用 JavaScript，或直接<a href="assets/view/">浏览 GIF 文件目录</a>。</p></noscript>
</main>
<script>
'use strict';
const directory = new URL('assets/view/', document.baseURI);
// Fallback for static servers that do not expose directory listings.
const catalog = [
  { file: 'lv_0_20261021210816.gif', width: 1074, height: 640, bytes: 20232799 },
  { file: 'petal_20261028_105113.gif', width: 776, height: 582, bytes: 71293643 },
  { file: 'Image_1793015011779_483.gif', width: 1440, height: 1080, bytes: 41775102 },
  { file: 'Image_1793015015154_795.gif', width: 1440, height: 1080, bytes: 36695581 },
  { file: 'Image_1793014930767_600.gif', width: 1440, height: 1080, bytes: 43388406 },
  { file: 'Image_1793014934366_245.gif', width: 960, height: 720, bytes: 49437143 },
  { file: 'Image_1793014970311_427.gif', width: 1440, height: 1080, bytes: 52018642 },
  { file: 'Image_1793014985391_112.gif', width: 1440, height: 1080, bytes: 52206667 },
  { file: 'Image_1793015127027_903.gif', width: 1440, height: 1080, bytes: 46858130 }
].map(item => ({ ...item, poster: 'assets/wallpaper-posters/' + item.file.replace(/\.gif$/i, '.png') }));
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const gallery = document.getElementById('gallery');
const players = new Map();
const downloadIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg>';
const fileUrl = item => new URL(encodeURIComponent(item.file), directory).href;

function stopPreview(player) {
  player.image.onload = null; player.image.onerror = null;
  player.image.removeAttribute('src'); player.image.hidden = true;
  player.cover.hidden = !player.item.poster; player.note.hidden = true; player.active = false;
}
function startPreview(player) {
  if (player.active || reducedMotion.matches) return;
  player.active = true; player.note.textContent = '加载中…'; player.note.hidden = false;
  player.image.onload = () => {
    if (!player.active) return;
    player.image.hidden = false; player.cover.hidden = true; player.note.hidden = true;
    const width = player.image.naturalWidth, height = player.image.naturalHeight;
    const resource = performance.getEntriesByName(player.image.currentSrc).at(-1);
    if (resource?.encodedBodySize) player.item.bytes = resource.encodedBodySize;
    player.item.width = width; player.item.height = height;
    player.meta.textContent = metadata(player.item);
  };
  player.image.onerror = () => {
    player.image.hidden = true; player.note.textContent = '加载失败，点击查看原图'; player.note.hidden = false;
  };
  player.image.src = fileUrl(player.item);
}
function metadata(item) {
  const size = item.bytes ? ' · ' + (item.bytes / 1048576).toFixed(1) + ' MB' : '';
  return (item.width ? item.width + ' × ' + item.height : 'GIF 动图') + size;
}
const observer = new IntersectionObserver(entries => {
  for (const entry of entries) {
    const player = players.get(entry.target);
    if (!player) continue;
    player.visible = entry.isIntersecting;
    if (player.visible) startPreview(player); else stopPreview(player);
  }
}, { rootMargin: '60px 0px', threshold: .01 });

function render(items) {
  observer.disconnect();
  players.forEach(stopPreview); players.clear();
  const fragment = document.createDocumentFragment();
  for (const item of items) {
    const card = document.createElement('article'); card.className = 'gif-card';
    const preview = document.createElement('a'); preview.className = 'preview';
    preview.href = fileUrl(item); preview.target = '_blank'; preview.rel = 'noopener';
    preview.setAttribute('aria-label', '查看 ' + item.file + ' 原图');
    const cover = document.createElement('img'); cover.alt = ''; cover.loading = 'lazy'; cover.decoding = 'async';
    cover.hidden = !item.poster;
    if (item.poster) cover.src = item.poster;
    cover.onerror = () => { cover.hidden = true; };
    const image = document.createElement('img'); image.className = 'gif-image'; image.alt = item.file + ' 动图预览'; image.decoding = 'async'; image.hidden = true;
    const format = document.createElement('span'); format.className = 'format'; format.textContent = 'GIF';
    const note = document.createElement('span'); note.className = 'load-note'; note.hidden = true;
    preview.append(cover, image, format, note);
    const footer = document.createElement('div'); footer.className = 'card-footer';
    const info = document.createElement('div'); info.className = 'file-info';
    const filename = document.createElement('h2'); filename.className = 'filename'; filename.textContent = item.file; filename.title = item.file;
    const meta = document.createElement('p'); meta.className = 'file-meta'; meta.textContent = metadata(item);
    info.append(filename, meta);
    const download = document.createElement('a'); download.className = 'download'; download.href = fileUrl(item); download.download = item.file;
    download.setAttribute('aria-label', '下载 ' + item.file); download.innerHTML = downloadIcon + '下载';
    footer.append(info, download); card.append(preview, footer); fragment.append(card);
    players.set(preview, { item, image, cover, note, meta, active: false, visible: false });
  }
  gallery.replaceChildren(fragment); gallery.setAttribute('aria-busy', 'false');
  document.getElementById('count').textContent = items.length + ' 张动图';
  if (!items.length) {
    const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = 'assets/view 目录中暂无 GIF 图片。'; gallery.append(empty);
  }
  players.forEach((player, preview) => observer.observe(preview));
}
async function loadGallery() {
  const controller = new AbortController(), timeout = setTimeout(() => controller.abort(), 4000);
  let items = catalog;
  try {
    const response = await fetch(directory, { cache: 'no-cache', signal: controller.signal });
    if (!response.ok || !response.headers.get('content-type')?.includes('text/html')) throw new Error('No directory listing');
    const listing = new DOMParser().parseFromString(await response.text(), 'text/html');
    const files = [...new Set([...listing.querySelectorAll('a[href]')].flatMap(link => {
      try {
        const url = new URL(link.getAttribute('href'), directory);
        if (url.origin !== directory.origin || url.search || url.hash || !url.pathname.startsWith(directory.pathname) || !/\.gif$/i.test(url.pathname)) return [];
        const file = decodeURIComponent(url.pathname.slice(directory.pathname.length));
        return file.includes('/') || file.includes('\\') ? [] : [file];
      } catch { return []; }
    }))];
    const heading = (listing.querySelector('title')?.textContent || '') + (listing.querySelector('h1')?.textContent || '');
    if (!files.length && !/directory listing|index of/i.test(heading)) throw new Error('No directory listing');
    const known = new Map(catalog.map(item => [item.file, item]));
    items = [...catalog.filter(item => files.includes(item.file)), ...files.filter(file => !known.has(file)).sort().map(file => ({ file }))];
  } catch { /* Embedded filenames keep ordinary static hosting functional. */ }
  finally { clearTimeout(timeout); }
  render(items);
}
reducedMotion.addEventListener('change', event => {
  players.forEach(player => { if (event.matches) stopPreview(player); else if (player.visible) startPreview(player); });
});
document.addEventListener('visibilitychange', () => {
  players.forEach(player => { if (document.hidden) stopPreview(player); else if (player.visible) startPreview(player); });
});
loadGallery();
</script>
</body>
</html>
